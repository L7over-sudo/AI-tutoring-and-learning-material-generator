<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>激活 AI 自动作图工具</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#263238;background:#f5faf8}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 10% 0,#fff1f3,transparent 42%),linear-gradient(145deg,#f8fbfa,#eef7f4)}main{width:min(660px,100%);max-height:100%;margin:0;padding:30px;border:1px solid #dbeae5;border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 22px 60px rgba(46,90,76,.13);overflow:hidden}.brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{display:grid;place-items:center;flex:0 0 52px;width:52px;height:52px;border-radius:15px;color:#fff;font-size:25px;background:linear-gradient(135deg,#ff6f83,#ee3e5d)}h1{margin:0;font-size:25px}p{color:#6b7774;line-height:1.7}button{border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:600}.secondary{color:#34745f;background:#e8f5f0}.primary{color:#fff;background:linear-gradient(135deg,#55bd92,#2d9d70)}textarea{display:block;width:100%;height:128px;min-height:0;padding:14px;border:1px solid #cad8d3;border-radius:11px;outline:0;resize:none;font:13px/1.6 ui-monospace,Consolas,monospace}textarea:focus{border-color:#45aa82;box-shadow:0 0 0 3px rgba(69,170,130,.12)}.plans{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.plans i{padding:6px 10px;border-radius:999px;color:#566460;background:#edf3f1;font-size:12px;font-style:normal}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.status{min-height:24px;margin-top:14px;color:#d04458;font-size:13px}.status.ok{color:#24845e}.hint{font-size:13px}.hidden{display:none}@media (max-height:640px){body{padding:12px}main{padding:22px}.brand{margin-bottom:12px}.plans{margin:10px 0}textarea{height:104px}.status{margin-top:8px}.hint{margin:8px 0}.actions{margin-top:10px}}@media (max-height:540px){main{padding:16px}.brand{margin-bottom:8px}.logo{flex-basis:44px;width:44px;height:44px}h1{font-size:21px}.brand p{margin:4px 0}.plans{margin:7px 0}textarea{height:82px}.status{min-height:18px;margin-top:5px}.hint{margin:5px 0;line-height:1.4}.actions{margin-top:7px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="logo">📚</div><div><h1>激活 AI 自动作图工具</h1><p id="reason">请输入软件提供方发送的激活码。</p></div></div>
    <div class="plans"><i>一天卡</i><i>7天卡</i><i>14天卡</i><i>月卡</i><i>年卡</i><i>永久卡</i></div>
    <textarea id="code" spellcheck="false" placeholder="请粘贴激活码"></textarea>
    <div id="status" class="status"></div>
    <p class="hint">激活码无需绑定电脑；限时卡在所有电脑上的到期时间相同。</p>
    <div class="actions"><button id="quitButton" class="secondary">退出</button><button id="activateButton" class="primary">立即激活</button></div>
  </main>
  <script src="./activation.js"></script>
</body>
</html>
